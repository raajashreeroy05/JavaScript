<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Learning</title>
</head>
<body>
    <div class="week" style = "background-color: lightblue; color:darkblue">
        <div class="day">Sunday</div>
        <div class="day">Monday</div>
        <div class="day">Tuesday</div>
        <div class="day">Wednesday</div>
        <div class="day">Thursday</div>
        <div class="day">Friday</div>
        <div class="day">Saturday</div>
    </div>
</body>
<script>
    const parent = document.querySelector('.week');
    console.log(parent);
    console.log(parent.children);
    console.log(parent.children[0].innerText);
    console.log("\n");
    for(let i=0; i<parent.children.length; i++) {
        console.log(parent.children[i].innerText);
    }
    console.log("\n");
    parent.children[0].style.color = "orange";
    console.log(parent.firstElementChild);
    console.log(parent.lastElementChild);
    const dayOne = document.querySelector('.day');
    console.log(dayOne);
    console.log(dayOne.parentElement);
    console.log("Next Sibling: ", dayOne.nextElementSibling);
    console.log("Previous Sibling: ", dayOne.previousElementSibling);
    console.log("NODES: ", parent.childNodes);

</script>
</html>
