<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: #212121; color: white;"></body>
<script>
    const div = document.createElement('div');
    console.log(div)
    div.className = "box1";
    div.id = Math.round((Math.random()*10)+1);
    div.setAttribute('title', 'This is a div');
    //div.innerText = "This div is created by me.";
    const addText = document.createTextNode("This div is created by me.");
    //addText.textContent = "This div is created by me.";
    div.appendChild(addText);
    div.style.backgroundColor = "pink";
    div.style.padding = "15px";
    div.style.color = "black";
    div.style.width = "200px";
    div.style.textAlign = "center";
    div.style.borderRadius = "5px";
    document.body.appendChild(div);
    
</script>
</html>
